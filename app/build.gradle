plugins { id 'com.android.application' }

android {
    namespace 'com.chichasonic.ruta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chichasonic.ruta'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Cliente HTTP compatible con PATCH y con Android 8+ (no usa claves secretas).
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
